services:
  mongodb:
    image: mongo:8.0
    container_name: tomini-pos-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
      MONGO_INITDB_DATABASE: tomini_pos

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: